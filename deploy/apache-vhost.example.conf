# GARDA 01 — Apache VirtualHost example

<VirtualHost *:80>
    ServerName your-domain.example
    ServerAlias www.your-domain.example
    Redirect permanent / https://your-domain.example/
</VirtualHost>

<VirtualHost *:443>
    ServerName your-domain.example
    ServerAlias www.your-domain.example

    DocumentRoot "/var/www/garda01/current/public"

    <Directory "/var/www/garda01/current/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "/var/www/garda01/current">
        Require all denied
    </Directory>

    ErrorLog "${APACHE_LOG_DIR}/garda01-error.log"
    CustomLog "${APACHE_LOG_DIR}/garda01-access.log" combined

    SSLEngine on
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/privkey.pem
</VirtualHost>
